name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Lattice.slnx
      - name: Build
        run: dotnet build Lattice.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Lattice.slnx -c Release --no-build --report-trx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
