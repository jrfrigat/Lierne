name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Lierne.slnx
      - name: Build
        run: dotnet build Lierne.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Lierne.slnx -c Release --no-build --report-trx
      - name: Pack
        run: dotnet pack Lierne.slnx -c Release --no-build --output artifacts/packages
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: lierne-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
